name: Kodo Linux scoped probe

on:
  push:
    branches: ['codex/kodo-linux-probe-**']

permissions:
  contents: read

jobs:
  scoped-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3c39de09eaca16997834c3de07f2e936072915a5
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify exact source, Node and frozen oracle
        shell: bash
        run: |
          set -euo pipefail
          echo 'Expected source HEAD: 3c39de09eaca16997834c3de07f2e936072915a5'
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = '3c39de09eaca16997834c3de07f2e936072915a5'
          node --version
          echo 'fa0a150b981f9b0ea609e2204bf562a5b04f546f86dc74450ec541bf8635c7c5  tests/project-director-oracle.test.mjs' | sha256sum --check
          echo '351abf9f5c45e6144561aa3759c177a9d7a25c68f4ce257a8ef0ef2877e3e039  tests/project-director.test.mjs' | sha256sum --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo 'SCOPED ONLY: no full-check, installed-package, release or deployment claim'
      - name: Install locked dependencies without scripts
        run: npm ci --ignore-scripts
      - name: Exact frozen 1000-amendment SQLite coherence scenario
        shell: bash
        run: |
          set -euo pipefail
          node --test '--test-name-pattern=Director actual SQLite snapshot counts bodies and revision stay coherent during concurrent amendments' tests/project-director-oracle.test.mjs | tee "$RUNNER_TEMP/kodo-linux-coherence.tap"
      - name: Actual Director recovery and unchanged frozen oracle, concurrency 2
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=2 tests/project-director.test.mjs tests/project-director-oracle.test.mjs | tee "$RUNNER_TEMP/kodo-linux-director-oracle.tap"
